<html lang="zh-CN" data-boot-wordmark="馆务工作台" data-boot-loading="正在打开馆务工作台…" data-boot-failure="馆务工作台暂时无法打开">
  <head>

    <style>#museum-demo-label {
  position: fixed;
  right: max(10px, env(safe-area-inset-right));
  bottom: max(10px, env(safe-area-inset-bottom));
  z-index: 9999;
  margin: 0;
  padding: 5px 9px;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 8px;
  color: white;
  background: #423654;
  box-shadow: 0 2px 8px #12111b36;
  font: 12px/1.5 system-ui,sans-serif;
  pointer-events: none;
}

.museum-demo-loading {
  display: grid;
  min-height: 100svh;
  place-content: center;
  box-sizing: border-box;
  margin: 0;
  padding: 24px;
  color: #423654;
  background: #f7f5fa;
  font: 16px/1.5 system-ui, sans-serif;
}
</style>
    <script>(() => {
  const user = {
    id: 'public-demo-viewer', name: '演示访客', role: 'member',
    permissions: ['projects:view', 'tasks:view', 'calendar:view', 'documents:view', 'photos:view', 'contacts:view', 'ai:use'],
  };
  const now = new Date();
  const instant = (days = 0, hour = 10) => {
    const date = new Date(now);
    date.setDate(date.getDate() + days);
    date.setHours(hour, 0, 0, 0);
    return date.toISOString();
  };
  const day = (days) => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai' }).format(new Date(instant(days)));
  const project = (id, code, name, status, description, start, end, completed, total) => ({
    id, code, name, status, description, canEdit: false, version: 1,
    owner: { name: '演示馆员' }, ownerId: null, startsOn: day(start), endsOn: day(end),
    progress: { completed, total }, members: [], coverPhotoId: null,
  });
  const projects = [
    project('demo-exhibit', 'DEMO-01', '江南工艺与生活', 'active', '展示纸本、织物和日用器物的专题展览。此处为演示资料。', -7, 18, 2, 5),
    project('demo-collection', 'DEMO-02', '馆藏整理与开放日', 'planning', '馆藏目录核对及公众导览筹备。此处为演示资料。', -2, 26, 1, 3),
    project('demo-paper', 'DEMO-03', '纸本修护与数字化', 'active', '完成纸本状态登记、摄影和档案校验，并汇总需要进一步修护的样件。', -12, 11, 1, 4),
  ];
  const tasks = [
    ['demo-task-1', projects[0], '复核第一批展品标签', '对照样例清单检查展签和摆放位置。', 'in_progress', 'onsite', 'high', 2],
    ['demo-task-2', projects[1], '整理开放日导览路线', '准备入口、集合点和导览顺序。', 'pending_review', 'general', 'normal', 4],
    ['demo-task-3', projects[2], '校验纸本摄影文件命名', '核对展品编号、拍摄视角和文件命名。', 'in_progress', 'document', 'normal', 3],
    ['demo-task-4', projects[0], '确认借展包装尺寸', '向演示借展方核对包装箱和展柜尺寸。', 'done', 'contact', 'normal', -1],
  ].map(([id, item, name, description, status, type, priority, offset]) => ({
    id, projectId: item.id, name, description, status, type, priority,
    dueAt: instant(offset), version: 1, assigneeId: user.id, assignee: { name: user.name },
    collaborators: [], createdByName: '演示馆员',
  }));
  const demoId = (suffix) => '10000000-0000-4000-8000-' + String(suffix).padStart(12, '0');
  const calendar = [
    [demoId(1), projects[0], '展签与布展进度核对', 0, 14],
    [demoId(2), projects[1], '开放日导览彩排', 2, 10],
    [demoId(3), projects[2], '纸本状况复核', 3, 15],
  ].map(([id, item, name, offset, hour]) => ({
    id, projectId: item.id, projectName: item.name, name, startsAt: instant(offset, hour),
    endsAt: instant(offset, hour + 1), version: 1, allDay: false, ownerId: null,
    ownerName: '演示馆员', participants: [], remindMinutes: null, contactName: null,
  }));
  const documents = [
    ['demo-file-1', projects[0].id, '展签校对稿.docx', 18472],
    ['demo-file-2', projects[0].id, '借展物件清单.xlsx', 58030],
    ['demo-file-3', projects[1].id, '馆藏开放日导览.pdf', 242016],
    ['demo-file-4', null, '馆务工作说明.pdf', 55296],
    ['demo-file-5', projects[2].id, '纸本摄影索引.xlsx', 35749],
    ['demo-file-6', projects[2].id, '纸本状况登记表.docx', 20734],
  ].map(([id, projectId, name, size]) => ({
    id, projectId, name, size, folderId: null, version: 1, contentRevision: 1,
    createdAt: instant(-2), updatedAt: instant(-1), uploadedByName: '演示馆员',
    canManage: false, category: { name: '演示资料' },
  }));
  const contacts = [
    [projects[0], '陈闻舟', '演示借展机构', '展务联络', '借展清单、运输安排和交接时间。'],
    [projects[1], '林知夏', '演示公共教育组', '导览协调', '负责开放日讲解排班与观众集合安排。'],
    [projects[2], '沈墨宁', '演示纸本修护组', '纸本修护', '负责样件状态核查和摄影档案交接。'],
  ].map(([item, name, company, title, notes], index) => ({
    id: demoId(index + 11), projectId: item.id, name, company, title, notes,
    email: 'contact' + (index + 1) + '@example.invalid', phone: '', wechat: '',
    originalText: '', translatedText: '', otherPhones: [], otherEmails: [],
    level: 2, createdAt: instant(-3), version: 1, hasCard: false, canManage: false,
  }));
  const tags = [
    { id: demoId(31), name: '展陈筹备', colorId: 'mist-purple', archived: false },
    { id: demoId(32), name: '公众导览', colorId: 'warm-sand', archived: false },
    { id: demoId(33), name: '藏品档案', colorId: 'sage', archived: false },
  ];
  const notices = calendar.slice(0, 2).map((event, index) => ({
    id: demoId(index + 21), kind: index === 0 ? 'updated' : 'reminder',
    eventId: event.id, eventName: event.name, projectName: event.projectName,
    actorName: '演示馆员', accessible: true, createdAt: instant(-1, 10 - index),
    readAt: instant(-1, 12), target: {
      type: 'calendar-event', id: event.id, eventVersion: event.version, currentVersion: event.version,
    },
  }));
  const scoped = (rows, query) => {
    if (query.has('projectId')) return rows.filter(row => row.projectId === query.get('projectId'));
    if (query.get('scope') === 'company') return rows.filter(row => row.projectId === null);
    return rows;
  };
  const json = (data, status = 200) => new Response(JSON.stringify(data), {
    status, headers: { 'Content-Type': 'application/json' },
  });
  const unavailable = () => json({ error: '公开演示仅供浏览。当前操作需要连接真实馆务服务。' }, 403);
  const original = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const url = new URL(input instanceof Request ? input.url : input, location.href);
    if (url.origin !== location.origin || !url.pathname.startsWith('/api/')) return original(input, init);
    const method = (init?.method || (input instanceof Request && input.method) || 'GET').toUpperCase();
    const path = url.pathname.slice(4);
    const query = url.searchParams;
    if (method === 'GET') {
      switch (path) {
        case '/auth/me': return json({ user });
        case '/health': return json({ ok: true, demo: true });
        case '/projects':
        case '/projects/roster':
        case '/documents/projects':
        case '/tasks/projects':
        case '/photos/projects':
        case '/contacts/projects':
        case '/calendar/projects': return json(query.has('cursor') ? [] : projects);
        case '/tasks': return json(scoped(tasks, query));
        case '/calendar': return json(scoped(calendar, query));
        case '/documents': return json(scoped(documents, query));
        case '/contacts': {
          const search = query.get('search')?.trim().toLowerCase();
          if (query.get('archived') === 'true') return json([]);
          const rows = scoped(contacts, query);
          return json(search ? rows.filter((row) =>
            [row.name, row.company, row.title, row.notes].some((value) => value.toLowerCase().includes(search))
          ) : rows);
        }
        case '/inbox': return json({ notices, unread: 0 });
        case '/conversations': return json({ items: [], nextCursor: null });
        case '/contacts/ai/status': return json({ available: false });
        case '/tags': return json({ tags });
        case '/dispatch/inbox':
        case '/dispatch/sent': return json({ items: [], nextCursor: null });
        case '/me/layout': return json({}, 404);
      }
      const projectPath = path.match(/^\/projects\/([^/]+)(\/tags)?$/);
      if (projectPath) {
        const index = projects.findIndex(row => row.id === projectPath[1]);
        if (index === -1) return json({ error: '未找到演示项目' }, 404);
        return json(projectPath[2] ? { version: 1, tags: [tags[index]] } : projects[index]);
      }
      if (/^\/(folders|photos|albums|contacts|groups)(\/|$)/.test(path) ||
          /\/(records|submissions|revisions)$/.test(path)) return json([]);
      return unavailable();
    }
    return unavailable();
  };
  // Keep any demonstration-only editing action from pointing at the viewer's machine.
  document.addEventListener('click', (event) => {
    if (!(event.target instanceof Element)) return;
    const anchor = event.target.closest('a[href]');
    if (!anchor) return;
    const url = new URL(anchor.href);
    if (url.origin !== location.origin && ['127.0.0.1', 'localhost'].includes(url.hostname) ||
        url.origin === location.origin && url.pathname.startsWith('/api/')) {
      event.preventDefault();
      document.querySelector('#museum-demo-label').textContent = '演示版 · 文件编辑和下载未开放';
    }
  }, true);
})();
</script>
    <script type="module" crossorigin src="/assets/museum-BzuqjX4B.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/museum-hmUdjqKe.css">
  </head>

    <div id="root">
      <p class="museum-demo-loading" role="status">正在打开馆务工作台…</p>
    </div>
    <p id="museum-demo-label" role="status">公开演示 · 示例数据 · 只读</p>
  </body>
</html>
