        return json({ version: 1, tags: projectIndex < 0 ? [] : [tags[projectIndex]] });
      }
      const matchingPhoto = photos.find(row => path === '/photos/' + row.id + '/download');
      if (matchingPhoto) return original('/demo-assets/gallery/' + matchingPhoto.id + '.webp', { signal: init?.signal });
      const folder = [...folders, archivedFolder].find(row => path === '/folders/' + row.id);
      if (folder) return json(folder);
      const claim = claims.find(row => path === '/reimbursements/' + row.id);
      if (claim) return json(claim);
      const dispatchDetail = [...dispatch, sentDispatch].find(row => path === '/dispatch/' + row.id);
      if (dispatchDetail) return json(dispatchDetail);
      const task = tasks.find(row => path === '/tasks/' + row.id + '/records');
      if (task) return json([taskRecord(task)]);
      const boardTask = tasks.find(row => path === '/tasks/' + row.id + '/board');
      if (boardTask) return json([...dispatch, sentDispatch].filter(row => row.parentTaskId === boardTask.id).map(row => ({
        id: row.id, recipientName: row.recipientName || user.name, dueAt: row.dueAt, overdue: row.overdue, progress: row.progress,
      })));
      if (path === '/tasks/' + tasks[1].id + '/submissions') return json([{
        id: demoId(91), round: 1, note: '已确认入口集合点与两条备选路线，等候展务组复核。',
        status: 'submitted', reviewNote: '', submittedByName: '演示访客', submittedAt: instant(-1),
      }]);
      const document = allDocuments.find(row => path === '/documents/' + row.id + '/download');
      if (document) {
        const response = await original(document.demoDownload, { signal: init?.signal });
        if (!response.ok) return response;
        const headers = new Headers(response.headers);
        headers.set('x-museum-file-version', String(document.version));
        headers.set('content-length', String(document.size));
        return new Response(response.body, { headers });
      }
      const revisions = allDocuments.find(row => path === '/documents/' + row.id + '/revisions');
      if (revisions) return json(Array.from({ length: revisions.contentRevision }, (_, index) => ({
        id: revisions.id + '-v' + (index + 1), number: index + 1, name: revisions.name,
        ...documentVersion(revisions, index + 1),
        uploadedByName: '演示馆员', createdAt: index === 0 ? revisions.createdAt : revisions.updatedAt,
      })).reverse());
      const projectPath = path.match(/^\/projects\/([^/]+)(\/tags)?$/);
      if (projectPath) {
        const index = projects.findIndex(row => row.id === projectPath[1]);
        if (index === -1) return json({ error: '未找到演示项目' }, 404);
        return json(projectPath[2] ? { version: 1, tags: [tags[index]] } : projects[index]);
      }
      if (/^\/(folders|photos|albums|contacts|groups)(\/|$)/.test(path) ||
          /\/(records|submissions|revisions)$/.test(path)) return json([]);
      return unavailable();
    }
    if (assistantUrl && method === 'POST' && path === '/agent/chat') return askAssistant(init);
    return unavailable();
  };
  // Keep any demonstration-only editing action from pointing at the viewer's machine.
  document.addEventListener('click', (event) => {
    if (!(event.target instanceof Element)) return;
    const anchor = event.target.closest('a[href]');
    if (!anchor) return;
    const url = new URL(anchor.href);
    if (url.origin !== location.origin && ['127.0.0.1', 'localhost'].includes(url.hostname) ||
        url.origin === location.origin && url.pathname.startsWith('/api/')) {
      event.preventDefault();
      document.querySelector('#museum-demo-label').textContent = '演示版 · 此操作仅在正式工作台开放';
    }
  }, true);
})();
</script>
